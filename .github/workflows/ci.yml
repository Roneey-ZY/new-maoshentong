name: Verify TradeCheck
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tradecheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_phase_b.py::test_postgres_storage_when_service_available -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/tradecheck_test?sslmode=disable
      - name: Create isolated recovery database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres tradecheck_recovery
      - name: Prepare saved versions in a fresh process
        run: python -m scripts.recovery_probe --phase prepare --state recovery-state.json
        env:
          TEST_RECOVERY_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/tradecheck_recovery?sslmode=disable
      - name: Stop isolated database and verify safe failure
        shell: bash
        run: |
          docker stop "${{ job.services.postgres.id }}"
          python -m scripts.recovery_probe --phase unavailable --state recovery-state.json
        env:
          TEST_RECOVERY_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/tradecheck_recovery?sslmode=disable
      - name: Restart isolated database and verify persisted reports
        shell: bash
        run: |
          docker start "${{ job.services.postgres.id }}"
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          python -m scripts.recovery_probe --phase restore --state recovery-state.json
        env:
          TEST_RECOVERY_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/tradecheck_recovery?sslmode=disable
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.verify_frozen_archive --commit f3f8161
      - run: python -m scripts.verify_frozen_archive --commit d539f3d --dataset data/optimization_validation/v2
      - run: python -m pytest -q --junitxml=phase-b-results.xml
      - name: Verify local design assets and host-loader compatibility
        run: |
          python -m scripts.check_design_assets --output design-assets.json
          node scripts/check_design_runtime.cjs design-assets.json
      - run: python -m scripts.replay_mapping_safety
      - run: python -m scripts.replay_csv_regression --output csv-regression-ci.json
      - run: python -m scripts.evaluate_procurement --phase evaluate --output procurement-ci-results
      - run: python -m scripts.evaluate --mode rules --output phase-a-evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            phase-b-results.xml
            phase-a-evaluation.json
            csv-regression-ci.json
            procurement-ci-results/evaluation.json
            procurement-ci-results/REPORT.md
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tradecheck-phase-a .
      - name: Check container startup
        shell: bash
        run: |
          docker run -d --name tradecheck -p 8501:8501 tradecheck-phase-a
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -qx ok; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs tradecheck
            exit 1
          fi
          docker restart tradecheck
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -qx ok; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs tradecheck
            exit 1
          fi
